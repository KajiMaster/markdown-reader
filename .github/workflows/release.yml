name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            build-essential \
            xdg-utils

      - run: npm ci

      - name: Build and publish Tauri bundles (AppImage, .deb)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "md-read ${{ github.ref_name }}"
          releaseBody: "See the commit history for what changed in this release."
          releaseDraft: false
          prerelease: false

      - name: Package raw binary tarball (for AUR / install.sh)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="md-read-${VERSION}-x86_64"
          mkdir -p "$STAGE"
          cp src-tauri/target/release/md-read "$STAGE/"
          cp src-tauri/icons/icon.png "$STAGE/md-read.png"
          cat > "$STAGE/md-read.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=md-read
          Comment=A lightweight Markdown viewer/editor
          Exec=md-read %f
          Icon=md-read
          Terminal=false
          Categories=Utility;Office;
          MimeType=text/markdown;
          EOF
          tar czf "${STAGE}.tar.gz" "$STAGE"

      - name: Upload tarball to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: md-read-*.tar.gz
